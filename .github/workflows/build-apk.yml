name: Build ClimbR APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Copy web app and sync Capacitor
        run: |
          node scripts/copy-web.js
          npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "ClimbR-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ClimbR-1.0.${{ github.run_number }}
          path: ClimbR-1.0.${{ github.run_number }}.apk

      - name: Publish as release (download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ClimbR 1.0.${{ github.run_number }}
          body: "Install: download the APK on your phone and open it. Updates install over the old version and keep your data."
          files: ClimbR-1.0.${{ github.run_number }}.apk
          make_latest: true
