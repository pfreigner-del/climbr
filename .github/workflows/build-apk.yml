name: Build ClimbR APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages (preinstalled SDK on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Copy web app and sync Capacitor
        run: |
          node scripts/copy-web.js
          echo '{"version":"1.0.${{ github.run_number }}"}' > www/version.json
          npx cap sync android

      - name: Load signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing (Settings → Secrets and variables → Actions)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/climbr.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/climbr.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "ClimbR-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ClimbR-1.0.${{ github.run_number }}
          path: ClimbR-1.0.${{ github.run_number }}.apk

      - name: Publish as release (download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ClimbR 1.0.${{ github.run_number }}
          body: "Install: download the APK on your phone and open it. Updates install over the old version and keep your data."
          files: ClimbR-1.0.${{ github.run_number }}.apk
          make_latest: true

      - name: Publish to public download repo (if token is set)
        env:
          GH_TOKEN: ${{ secrets.DOWNLOAD_REPO_TOKEN }}
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "ClimbR-1.0.${{ github.run_number }}.apk" \
            --repo pfreigner-del/climbr-download \
            --title "ClimbR 1.0.${{ github.run_number }}" \
            --notes "Android: download the APK and open it. Updates install over the old version and keep your data." \
            --latest
