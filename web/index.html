<!doctype html><html lang="en"><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000">

<title>ClimbЯ</title>
<style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#fff}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><style>
/*
  Layout: single scrollable column, phone-first. A "Route-Karte" (route
  card) for today sits up top with a colored spine marking the day type
  (amber = climbing, teal = cross-training); below it a 14-day streak strip
  of small dots, then a collapsible reference of both training templates.
*/
:root{
  --bg:#000000; --surface:#0e0e0e; --surface-2:#161616; --fg:#ffffff;
    --muted:#9b9b9b; --line:#2b2b2b;
    --climb:#ffffff; --climb-fg:#ffffff;
    --ausgleich:#cfcfcf; --ausgleich-fg:#e8e8e8;
    --good:#ffffff; --warn:#8c8c8c;
  --font-display:'Bebas Neue',Impact,'Arial Narrow Bold',sans-serif;
  --font-body:'Work Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0e0e0e; --surface-2:#161616; --fg:#ffffff;
    --muted:#9b9b9b; --line:#2b2b2b;
    --climb:#ffffff; --climb-fg:#ffffff;
    --ausgleich:#cfcfcf; --ausgleich-fg:#e8e8e8;
    --good:#ffffff; --warn:#8c8c8c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0e0e0e; --surface-2:#161616; --fg:#ffffff;
    --muted:#9b9b9b; --line:#2b2b2b;
    --climb:#ffffff; --climb-fg:#ffffff;
    --ausgleich:#cfcfcf; --ausgleich-fg:#e8e8e8;
    --good:#ffffff; --warn:#8c8c8c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2{margin:0;font-family:var(--font-display);letter-spacing:.02em;font-weight:400}
h1{font-size:clamp(34px,9vw,44px);line-height:.95}
h2{font-size:20px;color:var(--fg)}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dateline{font-family:var(--font-mono);font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.top{padding-top:4px}

.statrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .n{font-family:var(--font-display);font-size:30px;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card .spine{height:5px;width:100%}
.spine.klettern{background:var(--climb)}
.spine.ausgleich{background:var(--ausgleich)}
.card-body{padding:18px}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line)}
.badge.klettern{color:var(--climb-fg);border-color:var(--climb);background:color-mix(in srgb, var(--climb) 12%, transparent)}
.badge.ausgleich{color:var(--ausgleich-fg);border-color:var(--ausgleich);background:color-mix(in srgb, var(--ausgleich) 12%, transparent)}
.badge.good{color:var(--good);border-color:var(--good);background:color-mix(in srgb, var(--good) 14%, transparent)}
.badge.warn{color:var(--warn);border-color:var(--warn);background:color-mix(in srgb, var(--warn) 14%, transparent)}

.toggle{display:flex;gap:8px;margin:14px 0 4px}
.toggle button{flex:1;min-width:0;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-family:var(--font-body);font-weight:600;font-size:14px}
.toggle button.active.klettern{background:var(--climb);border-color:var(--climb);color:#fff}
.toggle button.active.ausgleich{background:var(--ausgleich);border-color:var(--ausgleich);color:#fff}

.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;margin:12px 0}

.exlist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ex{display:flex;align-items:center;gap:11px;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.ex.catchup{border-color:var(--warn);background:color-mix(in srgb, var(--warn) 9%, var(--surface-2))}
.ex .box{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.ex.done .box{background:var(--good);border-color:var(--good);color:#fff}
.ex .tx{min-width:0;flex:1}
.ex .nm{font-size:14.5px;font-weight:600;line-height:1.25}
.ex.done .nm{text-decoration:line-through;color:var(--muted)}
.ex .sets{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}

.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1;padding:12px 10px;border-radius:12px;border:1px solid var(--line);font-family:var(--font-body);font-weight:700;font-size:14px;background:var(--surface-2);color:var(--fg)}
.actions button.yes{background:var(--good);border-color:var(--good);color:#fff}
.actions button.no{background:transparent;color:var(--warn);border-color:var(--warn)}
.edit-link{margin-top:14px;background:none;border:none;color:var(--ausgleich-fg);font-family:var(--font-body);font-size:13px;font-weight:600;text-decoration:underline;padding:0}

.history h2{margin-bottom:10px}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--muted);flex:none}
.dot.klettern-good{background:var(--climb);border-color:var(--climb);color:#fff}
.dot.ausgleich-good{background:var(--ausgleich);border-color:var(--ausgleich);color:#fff}
.dot.klettern-bad{border-color:var(--climb);color:var(--climb-fg)}
.dot.ausgleich-bad{border-color:var(--ausgleich);color:var(--ausgleich-fg)}

.reference{border-top:1px solid var(--line);padding-top:16px}
.ref-toggle{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--fg);display:flex;justify-content:space-between;align-items:center}
.ref-toggle .car{color:var(--muted);transition:transform .15s}
.ref-toggle[aria-expanded="true"] .car{transform:rotate(180deg)}
.ref-body{margin-top:12px;display:flex;flex-direction:column;gap:14px}
.plan{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--surface)}
.plan h3{margin:0 0 8px;font-family:var(--font-display);font-weight:400;font-size:19px}
.plan h3.a{color:var(--climb-fg)}
.plan h3.b{color:var(--ausgleich-fg)}
.plan ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
.plan .sets{font-family:var(--font-mono);color:var(--muted);font-size:12px}

.foot{text-align:center;font-size:12px;color:var(--muted);padding-top:4px}
.backup{display:flex;gap:10px;justify-content:center;margin-top:8px}
.backup button{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--muted);font-family:var(--font-body);font-size:12px}
.banner{font-size:12.5px;background:color-mix(in srgb, var(--warn) 14%, var(--surface));border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 12px}
</style><style>
.brand{display:flex;align-items:center;gap:8px}
.brand svg{flex:none;margin-left:-6px}

/* ---- v3: black & white ---- */
.toggle button.active.klettern,.toggle button.active.ausgleich,.actions button.yes,.dot.klettern-good,.dot.ausgleich-good{color:#000}
.toggle button.active.ausgleich{background:#fff;border-color:#fff}
.dot.ausgleich-good{background:#cfcfcf;border-color:#cfcfcf}
.ex.catchup{border-color:#fff;border-style:dashed;background:var(--surface-2)}
.ex .tag{color:#fff;display:inline-flex;align-items:center;gap:3px}
.ex .tag img{width:13px;height:13px}
.ex.done .box{color:#000}
button.guided{background:#fff;color:#000;border-color:#fff}
.timer.work{background:#000}.timer.rest{background:#141414}.timer.manual{background:#0a0a0a}
.timer .bar i{background:#fff}
.ico{width:18px;height:18px;vertical-align:-3px}
.rcard .ri{width:30px;height:30px;display:block;margin-bottom:8px}
.rcard.add{border-style:dashed;display:flex;flex-direction:column;justify-content:center}
.rcard.add .rt{font-size:26px}
.rgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.stat .n{display:flex;align-items:center;gap:8px}.stat .n img{width:26px;height:26px}
.brand .mr{display:inline-block;transform:scaleX(-1)}
.brand{gap:0!important;align-items:flex-end!important;font-size:clamp(46px,13vw,60px)!important;line-height:1!important}
.brand img.logoC{width:1.04em;height:1.04em;margin:0 -0.05em 0.07em -0.07em;flex:none}
.brand > span{padding-bottom:0}
.actions button.no{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.actions button.no img{width:16px;height:16px;opacity:.8}
.backup button{display:inline-flex;align-items:center;gap:6px}.backup img{width:16px;height:16px;opacity:.75}
/* builder */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--font-body);font-size:15px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.box2{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.box2 h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:19px}
.btn{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-family:var(--font-body);font-weight:700;font-size:14px}
.btn.main{background:#fff;color:#000;border-color:#fff}
.btn.danger{background:transparent;color:var(--muted)}
.mini{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:9px;padding:6px 9px;font-size:13px;flex:none}
.hint{font-size:12.5px;color:var(--muted)}

/* ---- v4: tools & finger check-in ---- */
.fing{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.fing .fl{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.fing button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font-family:var(--font-mono);font-weight:600}
.fing button.on{background:#fff;color:#000;border-color:#fff}
.fnote{font-size:12.5px;color:var(--fg);border:1px dashed #fff;border-radius:10px;padding:8px 10px;margin-top:8px}
.preset{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.preset button{padding:16px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--font-display);font-size:28px}
.preset button small{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-top:4px;letter-spacing:.04em}

/* ---- v5: install bar ---- */
.install{display:flex;align-items:center;gap:10px;border:1px solid #fff;border-radius:14px;padding:10px 10px 10px 12px;background:var(--surface)}
.install img{width:34px;height:34px;flex:none}
.install .it{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px;color:var(--muted);line-height:1.35}
.install .it b{color:var(--fg);font-size:14px}
.bsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bsum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.bsum b{display:block;font-family:var(--font-display);font-size:24px;line-height:1}
.bsum span{font-size:11px;color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.ggrid.Gym{grid-template-columns:repeat(4,minmax(0,1fr))}
.ggrid button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font-family:var(--font-mono);font-size:13px;font-weight:600;min-width:0}
.ggrid.Gym button{font-size:18px;padding:12px 0}
.ggrid button.on{background:#fff;color:#000;border-color:#fff}
.rbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rbtns button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-family:var(--font-body);font-size:14px;font-weight:700;min-width:0}
.rbtns button .ico{width:30px;height:30px;margin:0}
.rbtns button:active{background:#fff;color:#000}.rbtns button:active .ico{filter:invert(1)}
.blist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.blist li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.blist .ico{width:22px;height:22px;flex:none;margin:0}
.blist b{font-family:var(--font-mono);font-size:15px;min-width:2.6em}
.blist .br{flex:1;font-size:14px;min-width:0}
.blist .bs{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.blist button{background:none;border:none;color:var(--muted);font-size:16px;padding:2px 4px}
.brand.antitle{font-family:var(--font-display);font-size:clamp(40px,12vw,56px)!important}
.anseg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.anseg button{padding:8px 0;border:none;border-radius:9px;background:transparent;color:var(--muted);font-family:var(--font-body);font-size:13px;font-weight:700;min-width:0}
.anseg button.on{background:#fff;color:#000}
.annav{display:flex;align-items:center;gap:8px}
.annav button{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:22px;line-height:1}
.annav button:disabled{opacity:.3}
.annav .anl,.annav input{flex:1;min-width:0;text-align:center;font-family:var(--font-body);font-weight:700;font-size:15px}
.annav input{background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:10px;color-scheme:dark}
.anbody{display:flex;flex-direction:column;gap:14px}
.anbody .guided{margin-top:0}
.ansys:empty{display:none}
.anempty{color:var(--muted);font-size:14px;line-height:1.5;border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center}
.antiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.antiles.four .n{font-size:26px}
.antiles .stat .n img{width:22px;height:22px}
.ansec h2{margin:0 0 10px}
.alegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.alegend span{display:flex;align-items:center;gap:6px}
.alegend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.k-flash{background:#fff}
.k-send{background:#8a8a8a}
.k-try{background:repeating-linear-gradient(135deg,#4a4a4a 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px #5a5a5a}
.pyr{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:3.2em minmax(0,1fr) 3.4em;align-items:center;gap:8px}
.prow .pg{font-family:var(--font-mono);font-size:13px;font-weight:600;text-align:right}
.prow .pb{display:flex;gap:2px;height:18px}
.prow .pb i{display:block;height:100%;border-radius:4px;min-width:4px}
.prow .pn{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.vol{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:4px}
.vcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;gap:4px}
.vcol .vn{font-family:var(--font-mono);font-size:10px;color:var(--muted);height:12px}
.vcol .vb{flex:1;width:100%;max-width:28px;display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start}
.vcol .vb i{display:block;width:100%;border-radius:4px}
.vcol .vb i[style="height:0%"]{display:none}
.vcol .vl{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.andays{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.andays button{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);font-family:var(--font-body)}
.andays .ad{font-weight:700;font-size:14px}
.andays .am{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.andays .ag{font-family:var(--font-mono);font-weight:700;font-size:15px}
.anview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.anview button{padding:10px 2px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);font-family:var(--font-body);font-size:13px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.anview button.on{background:#fff;color:#000;border-color:#fff}
.k-os{background:#fff}.k-fl{background:#cfcfcf}.k-rp{background:#8a8a8a}.k-tr{background:#4d4d4d}
.k-nt{background:repeating-linear-gradient(135deg,#4a4a4a 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px #5a5a5a}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font-family:var(--font-mono);font-size:13px;font-weight:600}
.chips button.on{background:#fff;color:#000;border-color:#fff}
.chips input{width:70px;padding:9px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--font-mono);font-size:13px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row3 .field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcalc{font-size:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.rpegrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.rpegrid button{padding:9px 0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);font-family:var(--font-mono);font-size:12.5px;font-weight:600;min-width:0}
.rpegrid button.on{background:#fff;color:#000;border-color:#fff}
.rpew{display:block;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:5px}
.rpecard{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.rpecard .fl{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rperow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rperow .rpew{margin:0;flex:1;min-width:0}
.rperow .mins{white-space:nowrap;flex:none}
.rperow .mins{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}

.bwrow input{margin-left:auto;width:90px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-family:var(--font-mono);font-size:15px;text-align:right}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 6px;min-width:0}

.bcard .bv{font-family:var(--font-display);font-size:26px;line-height:1.1}.bcard .bv small{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.bcard .bc{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-bottom:4px}
.lchart{width:100%;height:auto;display:block}

.lstate{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);font-size:13.5px;line-height:1.45}

.lstate.hi{border-color:#fff;border-style:dashed}
.rcard.due{border-color:#fff;border-style:dashed}
.anbody .ansec .guided{margin:0 0 10px}
.xtra{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.xitem{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.xitem .guided{margin:0}
.xhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.xtpl{display:flex;gap:4px}
.xtpl button{padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);font-family:var(--font-mono);font-size:11.5px}
.xtpl button.on{background:#fff;color:#000;border-color:#fff}
.xdel{margin-left:auto;background:none;border:none;color:var(--muted);font-size:16px;padding:2px 6px}
.xadd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.xadd .fl{grid-column:1/-1;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.xadd button{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--fg);font-family:var(--font-body);font-size:13.5px;font-weight:700;min-width:0}
.xadd .ico{width:18px;height:18px;margin:0}
.dot{min-width:28px;width:auto!important;padding:0 4px}
.ophoto{position:relative}
.topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pwrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#111}
.pwrap .ovl{position:absolute;inset:0}
.photo-full{display:block;width:100%;max-height:70vh;object-fit:contain;background:#111}
.topoed{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.tdview{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.tdstage{position:absolute;left:0;top:0;transform-origin:0 0}
.tdstage img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.tdstage #tdOver{position:absolute;inset:0;pointer-events:none}
.tdbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#0a0a0a}
.tdbar.top{justify-content:space-between;border-bottom:1px solid var(--line)}
.tdbar.top span{font-weight:700;font-size:15px}
.tdbar.top button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 14px;font-family:var(--font-body);font-weight:700;font-size:14px}
.tdbar.top button.main{background:#fff;color:#000;border-color:#fff}
.tdbar.bottom{flex-direction:column;align-items:stretch;border-top:1px solid var(--line)}
.tdcols,.tdw,.tdact{display:flex;gap:8px;justify-content:center}
.tdcols .sw{width:36px;height:36px;border-radius:50%;border:2px solid #444}
.tdcols .sw.on{outline:3px solid #fff;outline-offset:2px}
.tdw button{width:58px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center}
.tdw button i{display:block;width:30px;border-radius:9px;background:#fff}
.tdw button.on{background:#fff}.tdw button.on i{background:#000}
.tdact button{flex:1;max-width:120px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--font-body);font-weight:700;font-size:13.5px}
.tdhint{text-align:center;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.runscr{position:fixed;inset:0;z-index:45;background:#000;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));gap:12px}
.rtop{display:flex;align-items:center;gap:10px}
.rtop button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:7px 12px;font-family:var(--font-body);font-weight:700}
.rtop b{font-size:16px}
.gpsb{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:right}
.gpsb.ok{color:#fff}.gpsb.bad{color:#ffb4a8}
.rtop #rGps{margin-left:auto}
.rmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
.rdist{font-family:var(--font-display);font-size:clamp(84px,30vw,140px);line-height:.9;font-variant-numeric:tabular-nums}
.rdist small{font-size:22px;color:var(--muted);margin-left:6px}
.rtime{font-family:var(--font-mono);font-size:30px;font-variant-numeric:tabular-nums}
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:6px}
.rstats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.rstats b{display:block;font-family:var(--font-display);font-size:24px}
.rstats span{font-size:11px;color:var(--muted)}
.rtrace{width:100%;flex:1;min-height:80px;max-height:32vh;display:flex;align-items:center;justify-content:center}
.trace{width:100%;height:100%;max-height:32vh}
.trace.big{max-height:42vh;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-sizing:border-box}
.rbtns{display:flex;gap:10px}
.rbtns button{flex:1;padding:16px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--font-body);font-size:16px;font-weight:700}
.rbtns button.main{background:#fff;color:#000;border-color:#fff}
.rbtns button.big{padding:20px 8px;font-size:18px}
.rhint{font-size:12px;color:var(--muted);text-align:center;line-height:1.45}
.splits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.splits li{display:grid;grid-template-columns:3.4em minmax(0,1fr) 3.4em;align-items:center;gap:8px;font-family:var(--font-mono);font-size:13px}
.splits i{display:block;height:14px;border-radius:4px;background:#8a8a8a}
.splits b{text-align:right}
.runline{width:100%;display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-family:var(--font-body);text-align:left}
.runline b{font-family:var(--font-display);font-size:20px}.runline span{font-size:13px;color:var(--muted)}.runline .go{margin-left:auto;font-size:20px}
.xadd{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.anview{grid-template-columns:repeat(auto-fit,minmax(64px,1fr))!important}
.anview button{font-size:12.5px}
.badge.run{color:#fff;border-color:#9b9b9b}
.spine.run{background:#9b9b9b}
.dot.run-good{background:#6e6e6e;border-color:#6e6e6e;color:#fff}
.dot.run-bad{border-color:#6e6e6e}
.uppop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.uppop[hidden]{display:none}
.upbox{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;text-align:center}
.upbox img{width:56px;height:56px;margin:0 auto}
.upbox h2{margin:0;font-size:24px}
.upbox .upv{margin:0;font-family:var(--font-mono);font-size:14px;color:var(--muted)}
.upbox .upv b{color:var(--fg)}
.upbox .ups{margin:0 0 4px;font-size:13.5px;color:var(--muted);line-height:1.45}
.upbox a.btn{text-decoration:none;display:block}
.install .ib{flex:none;background:#fff;color:#000;border:none;border-radius:10px;padding:9px 14px;font-family:var(--font-body);font-weight:700;font-size:14px}
.install a.ib{text-decoration:none;display:inline-block}
.install .ix{flex:none;background:none;border:none;color:var(--muted);font-size:16px;padding:6px}

/* ---- v6: rest day ---- */
.spine.rest{background:#555}
.badge.rest{color:#fff;border-color:#777}
.toggle button.active.rest{background:#fff;color:#000;border-color:#fff}
.dot.rest{border-style:dashed;border-color:#777;color:#bbb}

/* ---- v7: pain log ---- */
.painrow{margin-top:10px}
.painbtn{width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:13.5px;font-weight:600}
.painbtn.on{border:1px solid #fff;color:#fff}
.ex .tag.watch{color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 5px;margin-left:2px}
.parea .ph{display:flex;justify-content:space-between;align-items:baseline}
.parea .pv{font-family:var(--font-display);font-size:24px}
.parea input[type=range]{width:100%;accent-color:#fff}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chk input{accent-color:#fff;width:18px;height:18px}

/* ---- v8: tabs & outdoor ---- */
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;background:#000;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 0}
.tabbar button img{width:24px;height:24px;opacity:.5}
.tabbar button.on{color:#fff}.tabbar button.on img{opacity:1}
.olist{display:flex;flex-direction:column;gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer}
.ocard .oimg{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#111}
.ocard .ob{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.ocard .ot{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ocard .on{font-weight:700;font-size:16px;min-width:0}
.ocard .og{font-family:var(--font-display);font-size:26px;line-height:1;flex:none}
.ocard .om{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.osort{display:flex;gap:8px;flex-wrap:wrap}
.osort button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.osort button.on{background:#fff;color:#000;border-color:#fff}
.photo-prev{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;background:#111}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gps{font-family:var(--font-mono);font-size:13px}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:16px;line-height:1.5}

/* ---- v9: Midjourney icon set ---- */
.ico{width:18px;height:18px;vertical-align:-3px;display:inline-block}
.ico.inv{filter:invert(1)}
.toggle button .ico.tg{display:block;margin:0 auto 4px;width:20px;height:20px}
.toggle button.active .ico.tg{filter:invert(1)}
.fing .fends{grid-column:1/-1;display:flex;justify-content:space-between;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:-1px}
.fing .fends b{color:var(--fg);font-weight:600}
.fing .fl .ico.fi{width:16px;height:16px;margin-right:6px;vertical-align:-3px}
.stat .n img{width:26px;height:26px}
.btn .ico,.guided .ico{margin-right:4px}
.painbtn .ico{margin-right:4px;opacity:.8}
.btn.main .ico{filter:invert(1)}
.btn.main .ico.inv{filter:invert(1)}

/* ---- v10: robust layout (large Android font sizes) + week plan ---- */
.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.rcard{padding:14px 12px;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;overflow:hidden}
.rcard .rt{font-size:clamp(17px,5.2vw,21px)!important;line-height:1.1;overflow-wrap:anywhere;hyphens:auto}
.rcard .rm{overflow-wrap:anywhere;line-height:1.35}
.rcard.add{align-items:flex-start}
.fing{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fing .fl{grid-column:1/-1;display:flex;align-items:center}
.fing button{width:auto!important;height:38px!important}
.toggle button{overflow-wrap:normal;word-break:normal;hyphens:none;line-height:1.2;font-size:13.5px!important}
.badge{max-width:100%;white-space:normal}
.stat{overflow:hidden}.stat .l{overflow-wrap:anywhere}
.card-body,.box2,.note,.intro,.ex .tx{overflow-wrap:anywhere}
.week{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.week .wh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.week .wh .wt{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.week .wh button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:6px 10px;font-family:var(--font-body);font-size:13px;font-weight:600}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{border:1px solid var(--line);border-radius:10px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.wd .dn{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.wd img{width:20px;height:20px}
.wd .dx{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.wd.today{border-color:#fff;background:var(--surface-2)}.wd.today .dn{color:#fff}
@media (max-width:400px){.wd .dx{display:none}.wd{padding:7px 0}}
.wpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.wpick button{padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font-family:var(--font-body);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.wpick button.on{background:#fff;color:#000;border-color:#fff}
.wrow{display:flex;flex-direction:column;gap:6px}
.wrow .wl{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.presets{display:flex;flex-direction:column;gap:8px}
.presets button{text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--font-body)}
.presets button b{display:block;font-size:14px}.presets button span{font-size:12.5px;color:var(--muted)}

/* ---- v11: history editing ---- */
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.hhead h2{margin:0!important}
.mini2{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:7px 10px;font-family:var(--font-body);font-size:13px;font-weight:600;flex:none}
.hday{background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.hday .hd{font-family:var(--font-mono);font-size:9.5px}
.dots{gap:8px!important}
/* ---- v2: routines, cues, timer ---- */
.ex .rest{display:block;font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-top:2px}
.ex .load{display:block;font-family:var(--font-mono);font-size:12px;color:var(--fg);margin-top:3px}
.timer .tload{font-family:var(--font-mono);font-size:14px;margin-top:8px}
.ex .cue{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.ex .tbtn{flex:none;border:1px solid var(--ausgleich);background:transparent;color:var(--ausgleich-fg);border-radius:10px;padding:7px 9px;font-family:var(--font-mono);font-size:12px;font-weight:600}
.guided{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1px solid var(--ausgleich);background:color-mix(in srgb,var(--ausgleich) 12%,transparent);color:var(--ausgleich-fg);font-family:var(--font-body);font-weight:700;font-size:14px}
.routines h2{margin-bottom:10px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;color:var(--fg);font-family:var(--font-body);min-width:0}
.rcard .rt{font-family:var(--font-display);font-size:20px;line-height:1}
.rcard .rm{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:4px}
.rcard.warm .rt{color:var(--climb-fg)} .rcard.cool .rt{color:var(--ausgleich-fg)}
.quick{display:flex;gap:8px;margin-top:12px}
.quick button{flex:1;min-width:0;padding:9px 6px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--fg);font-family:var(--font-body);font-size:13px;font-weight:600}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sheet .wrap{gap:14px}
.sheet .close{align-self:flex-start;background:none;border:none;color:var(--muted);font-family:var(--font-body);font-size:14px;font-weight:600;padding:0}
.sheet .intro{font-size:13.5px;color:var(--muted);line-height:1.5}
.evidence{font-size:12.5px;color:var(--muted);border-left:3px solid var(--ausgleich);padding:4px 0 4px 10px;line-height:1.45}

.timer{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;background:var(--bg);color:var(--fg);transition:background .25s}
.timer.work{background:color-mix(in srgb,var(--climb) 22%,var(--bg))}
.timer.rest{background:color-mix(in srgb,var(--ausgleich) 20%,var(--bg))}
.timer.manual{background:var(--surface-2)}
.timer .tprog{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.timer .tname{font-family:var(--font-display);font-size:clamp(28px,8vw,40px);line-height:1;margin-top:10px;max-width:520px}
.timer .tcue{font-size:14px;color:var(--muted);max-width:420px;margin:10px auto 0;line-height:1.45}
.timer .tphase{font-family:var(--font-mono);font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.timer .tclock{font-family:var(--font-display);font-size:clamp(110px,38vw,190px);line-height:.9;font-variant-numeric:tabular-nums}
.timer .tsub{font-family:var(--font-mono);font-size:14px;color:var(--muted);margin-top:6px}
.timer .tdose{font-family:var(--font-display);font-size:clamp(48px,14vw,72px);line-height:1}

<script>
/* ============ Exercise library ============
   timer: {work, sets, sides=1, reps=1, rest=0 (between reps), setRest, switchRest}
   prio: 1 = keep at all costs, 3 = first to drop on catch-up days            */
const EX = {
  // Plan A
  pushup: {sr:90, name:"Push-ups (or dips between two chairs)", dose:"3 × 8–12, 3 s down", prio:2, cue:"Body in one line, lower for 3 seconds. Feet elevated or dips once push-ups get easy."},
  pushplus: {sr:60, name:"Push-up plus", dose:"2 × 12", prio:1, cue:"Arms straight in plank: let shoulder blades sink together, then push the floor away and round the upper back."},
  extrot: {sr:60, load:"1–3 kg · start with 1 kg", name:"Side-lying external rotation (dumbbell)", dose:"3 × 12 / side, 3 s return", prio:1, cue:"Lie on your side, top elbow pinned to your ribs at 90°, light dumbbell. Rotate the forearm up, lower for 3 s."},
  ytw: {sr:60, load:"0–1 kg · bodyweight first", name:"Prone Y-T-W raises", dose:"2 × 8 each", prio:2, cue:"Lying face down, thumbs up. Squeeze shoulder blades down and back before lifting. No weight or very light dumbbells."},
  ohp: {sr:90, load:"4–12 kg per hand", name:"Dumbbell overhead press", dose:"3 × 8", prio:3, cue:"Ribs down, glutes tight. Press straight up, biceps by your ears. Pike push-ups work as a no-weight alternative."},
  plank:    {name:"Plank", dose:"3 × 45 s", prio:2, cue:"Elbows under shoulders, squeeze glutes, tuck pelvis slightly. Breathe.", timer:{work:45, sets:3, setRest:45}},
  sideplank:{name:"Side plank", dose:"2 × 30 s / side", prio:3, cue:"Elbow under shoulder, hips high and stacked. Drop to knees to regress.", timer:{work:30, sets:2, sides:2, setRest:45, switchRest:10}},
  // Plan B
  fingext: {name:"Finger extensor isometrics", dose:"4 × 8 reps · 5 s open / 6 s rest", prio:1, cue:"Extension band around your fingertips: open hard (~80 %) and hold 5 s. No band? Push fingertips up under a table edge.", timer:{work:5, rest:6, reps:8, sets:4, setRest:60}},
  wristext: {sr:60, load:"1–3 kg · start with 1 kg", name:"Eccentric wrist extension", dose:"3 × 15, 3 s down", prio:1, cue:"Forearm on your thigh, palm down, light dumbbell. Help it up with the other hand, lower for 3 s."},
  pronsup: {sr:45, load:"1–3 kg, held at one end", name:"Pronation / supination (dumbbell)", dose:"2 × 12 / side", prio:3, cue:"Hold a dumbbell at one end like a hammer, elbow at 90°. Rotate slowly palm-up ↔ palm-down."},
  squat: {sr:90, load:"8–20 kg", name:"Goblet squat", dose:"3 × 10", prio:2, cue:"Dumbbell at your chest, knees track over toes, sit between your heels, 3 s down."},
  lunge: {sr:90, load:"bodyweight → 4–10 kg per hand", name:"Bulgarian split squat", dose:"3 × 8 / leg", prio:3, cue:"Rear foot on a chair or bed, front knee over the foot, lower straight down. Add dumbbells when bodyweight gets easy."},
  sldl: {sr:60, load:"6–16 kg", name:"Single-leg Romanian deadlift", dose:"2 × 8 / leg", prio:3, cue:"Dumbbell in the opposite hand, hinge at the hip, back leg long, hips square."},
  hollow: {sr:90, name:"Hanging leg raises", dose:"3 × 6–10", prio:2, cue:"Hang from the pull-up bar, shoulders engaged, raise straight or bent legs to hip height with control. Mimics lifting your feet to high holds."},
  hip9090:  {name:"Hip mobility 90/90", dose:"2 × 40 s / side", prio:3, cue:"Both knees at 90°, sit tall, lean gently over the front shin.", timer:{work:40, sets:2, sides:2, setRest:10, switchRest:8}},
  // Catch-up / legacy
  plank40:  {name:"Plank", dose:"2 × 40 s", prio:1, cue:"Elbows under shoulders, squeeze glutes, breathe.", timer:{work:40, sets:2, setRest:30}},

  // Warm-up
  pulse: {name:"Pulse raiser", dose:"3 min", cue:"Jumping jacks, skipping on the spot or the approach walk. Get slightly warm.", timer:{work:180, sets:1}},
  armcirc: {name:"Arm circles + shoulder CARs", dose:"1 min", cue:"Big forward and backward arm circles, then slow full shoulder rotations (controlled articular rotations) on each side.", timer:{work:60, sets:1}},
  pullapart: {name:"Wall slides", dose:"2 × 10", cue:"Back, arms and wrists against a wall or rock, slide arms up into a Y and down into a W. Keep ribs down."},
  scappull: {name:"Scapular pull-ups", dose:"2 × 8", cue:"Hang on the pull-up bar (or Beastmaker jugs), arms straight. Pull shoulder blades down without bending the elbows."},
  wristmob: {name:"Wrist & finger mobility", dose:"1 min", cue:"Wrist circles, finger flicks, make a fist then spread wide. Gentle prayer stretch.", timer:{work:60, sets:1}},
  legswing: {name:"Leg swings + hip openers", dose:"1 min", cue:"Front/back and side leg swings, then knee-up hip circles (open the gate).", timer:{work:60, sets:1}},
  easyclimb: {name:"Easy climbing, progressive", dose:"~6 min", cue:"3–5 easy pitches or problems. Start on jugs, then slopers and pinches, crimps last. Easy breathing.", timer:{work:360, sets:1}},
  hangs: {name:"Progressive hangs (optional)", dose:"3 × 10 s", cue:"Before hard sessions: Beastmaker big edge, feet assisting at first. ~50 % → 70 % → 85 % effort. Skip if fingers feel tweaky.", timer:{work:10, sets:3, setRest:60}},
  // Cool-down & stretching
  easymove: {name:"Easy movement", dose:"3 min", cue:"A couple of very easy climbs or relaxed walking. Let your breathing settle.", timer:{work:180, sets:1}},
  flexstr:  {name:"Forearm flexor stretch", dose:"2 × 30 s / side", cue:"Arm straight, palm out, fingers up: gently pull fingers back with the other hand.", timer:{work:30, sets:2, sides:2, setRest:5, switchRest:5}},
  extstr:   {name:"Forearm extensor stretch", dose:"2 × 30 s / side", cue:"Arm straight, palm down, gently bend wrist down with the other hand.", timer:{work:30, sets:2, sides:2, setRest:5, switchRest:5}},
  chest:    {name:"Doorway chest stretch", dose:"2 × 30 s / side", cue:"Forearm on the door frame at shoulder height, step through until you feel the chest open.", timer:{work:30, sets:2, sides:2, setRest:5, switchRest:5}},
  latstr:   {name:"Lat stretch (side reach)", dose:"2 × 30 s / side", cue:"Hold a doorframe or rail, sit hips back and away until you feel the side of your back.", timer:{work:30, sets:2, sides:2, setRest:5, switchRest:5}},
  thread:   {name:"Thread the needle", dose:"1 × 30 s / side", cue:"On all fours, slide one arm under your body and rest the shoulder down. Breathe into the upper back.", timer:{work:30, sets:1, sides:2, switchRest:5}},
  hipflex:  {name:"Half-kneeling hip flexor stretch", dose:"2 × 40 s / side", cue:"Tuck pelvis under, squeeze the glute of the back leg, shift forward slightly.", timer:{work:40, sets:2, sides:2, setRest:5, switchRest:5}},
  frog:     {name:"Frog stretch", dose:"2 × 40 s", cue:"On all fours, knees wide, ankles in line with knees. Rock hips back gently.", timer:{work:40, sets:2, setRest:10}},
  pigeon:   {name:"Pigeon stretch", dose:"2 × 40 s / side", cue:"Front shin across, back leg long. Keep hips square, fold forward if comfortable.", timer:{work:40, sets:2, sides:2, setRest:5, switchRest:5}},
  hamstr: {name:"Straddle stretch (seated wide-leg)", dose:"2 × 40 s", cue:"Sit tall with legs wide, hinge forward from the hips with a long back. Hip abduction is linked to climbing level.", timer:{work:40, sets:2, setRest:10}},
  childside:{name:"Child's pose with side reach", dose:"2 × 40 s / side", cue:"Sit back to heels, walk both hands to one side.", timer:{work:40, sets:2, sides:2, setRest:5, switchRest:5}},
  chest40:  {name:"Doorway chest stretch", dose:"2 × 40 s / side", cue:"Forearm on the frame at shoulder height, step through gently.", timer:{work:40, sets:2, sides:2, setRest:5, switchRest:5}},
  sleeper:  {name:"Cross-body shoulder stretch", dose:"2 × 30 s / side", cue:"Pull one arm across your chest at shoulder height, keep the shoulder down.", timer:{work:30, sets:2, sides:2, setRest:5, switchRest:5}},
};

const PLANS = {
  A: {title:"Plan A — Push & shoulder health", ids:["pushup","pushplus","extrot","ytw","ohp","plank","sideplank"]},
  B: {title:"Plan B — Legs, hips & forearm balance", ids:["fingext","wristext","pronsup","squat","lunge","sldl","hollow","hip9090"]},
};
const ROUTINES = {
  warmup:  {title:"Warm-up", sub:"Before climbing · ~13 min",
    intro:"Raise your temperature, wake up shoulders and fingers, then climb progressively easy → harder.",
    evidence:"Climbing studies: a 10-min climbing-specific warm-up (easy climbing + finger-bar hangs) raised shoulder and elbow strength in climbers but not finger strength, and warm-ups showed no injury protection on their own. Use it to feel ready, not as insurance.",
    ids:["pulse","armcirc","pullapart","scappull","wristmob","legswing","easyclimb","hangs"]},
  cooldown:{title:"Cool-down", sub:"After climbing · ~10 min",
    intro:"Settle down and stretch the muscles climbing shortens: forearms, chest, lats.",
    evidence:"Climbing studies found no protective effect of cool-downs, so keep this short. No climbing study has tested specific cool-down content — the stretches target muscles climbing shortens.",
    ids:["easymove","flexstr","extstr","chest","latstr","thread"]},
  stretch: {title:"Stretching", sub:"Any day · ~15 min",
    intro:"Longer holds for mobility — hip opening for high steps, drop-knees and stemming, plus shoulders and forearms.",
    evidence:"In 60 advanced-to-elite climbers, hip abduction (straddle) correlated with climbing level — hamstring flexibility far less. Hold length (≤ 40 s) comes from general sports science: strength loss grows above 60 s per stretch.",
    ids:["hipflex","frog","pigeon","hamstr","childside","chest40","sleeper","flexstr"]},
};
// catch-up: from a missed plan, its 2 highest-priority exercises
function catchUpFrom(tpl){ return PLANS[tpl].ids.filter(id => EX[id].prio === 1).slice(0,2); }

function exItem(id, extra){ const e = EX[id]; return {id, name:e.name, sets:e.dose, done:false, ...(extra||{})}; }
function exMeta(item){ return (item && item.id && EX[item.id]) || null; }

/* ============ Dates ============ */
function todayISO(){
  const d = new Date(); const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
function fmtDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}); }
function dayShort(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit'}); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ State & storage ============ */
const STORE_KEY = 'climber.sessions.v1';
const TODAY = todayISO();
let sessions = [], draft = null;
function loadSessions(){ try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e){ return []; } }
function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(sessions)); }
  catch(e){ showBanner('Saving failed — is storage full or in private mode?'); }
}
function sessionFor(date){ return sessions.find(s => s.date === date) || null; }
function sortSessions(){ sessions.sort((a,b) => a.date < b.date ? 1 : -1); }

function isoAdd(iso, days){ const [y,m,d] = iso.split('-').map(Number); const t = new Date(y, m-1, d + days); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
// training days in a row right before today (completed climbing or cross-training)
function trainingStreakBeforeToday(){
  let n = 0, day = isoAdd(TODAY, -1);
  for (;;) { const s = sessionFor(day); if (trainedOn(s)) { n++; day = isoAdd(day, -1); } else break; }
  return n;
}
function trainedLast7(){ let n = 0; for (let i = 1; i <= 7; i++) { if (trainedOn(sessionFor(isoAdd(TODAY, -i)))) n++; } return n; }
function restReason(){
  const pr = painRestReason(); if (pr) return pr;
  const f = fingers[TODAY];
  if (f && f <= 2) return 'Your fingers feel off today.';
  const planned = plannedType(TODAY);
  if (planned) return planned === 'rest' ? 'Planned rest day in your week plan.' : '';
  const run = trainingStreakBeforeToday();
  if (run >= 3) return `You've trained ${run} days in a row.`;
  if (trainedLast7() >= 6) return 'You trained 6 of the last 7 days.';
  return '';
}
function suggestedTypeForToday(){
  if (restReason()) return 'rest';
  const planned = plannedType(TODAY);
  if (planned) return (planned === 'klettern' && upperPain() >= 4) ? 'ausgleich' : planned;
  const last = sessions.filter(s => s.date < TODAY && (s.type !== 'rest' || (s.extras && s.extras.length)))[0];
  const lastType = last ? lastActivity(last) : null;
  const next = lastType ? (lastType === 'klettern' ? 'ausgleich' : 'klettern') : 'ausgleich';
  return (next === 'klettern' && upperPain() >= 4) ? 'ausgleich' : next;
}

/* ---- extra trainings on the same day ---- */
function extrasOf(s){ return (s && s.extras) || []; }
function lastActivity(s){ const ex = extrasOf(s); return ex.length ? ex[ex.length - 1].type : s.type; }
function didType(s, type){ return !!s && ((s.type === type && s.completed) || extrasOf(s).some(x => x.type === type)); }
function trainedOn(s){ return !!s && ((s.completed && s.type !== 'rest') || extrasOf(s).length > 0); }
function crossCountBefore(date){ let n = 0; for (const s of sessions) if (s.date < date) { if (s.type === 'ausgleich') n++; n += extrasOf(s).filter(x => x.type === 'ausgleich').length; } return n; }
function nextTemplate(date){ const s = sessionFor(date); let n = crossCountBefore(date); if (s) { if (s.type === 'ausgleich') n++; n += extrasOf(s).filter(x => x.type === 'ausgleich').length; } return n % 2 === 0 ? 'A' : 'B'; }
function addExtra(date, type){
  let s = sessionFor(date); if (!s) return;
  if (s.type === 'rest') { s.type = type; s.completed = true; s.template = type === 'ausgleich' ? nextTemplate(date) : null; s.exercises = s.template ? PLANS[s.template].ids.map(id => ({...exItem(id), done:true})) : []; }
  else (s.extras = s.extras || []).push({id:'x' + Date.now(), type, template: type === 'ausgleich' ? nextTemplate(date) : null});
  s.updatedAt = Date.now(); persist(); render(); refreshPD(date);
}
function removeExtra(date, id){ const s = sessionFor(date); if (!s) return; s.extras = extrasOf(s).filter(x => x.id !== id); s.updatedAt = Date.now(); persist(); render(); refreshPD(date); }
function refreshPD(date){ if (PD && PD.date === date && !document.getElementById('sheet').hidden && document.getElementById('pdDate')) openPastDay(date); }
function setExtraTpl(date, id, t){ const x = extrasOf(sessionFor(date)).find(x => x.id === id); if (x) { x.template = t; sessionFor(date).updatedAt = Date.now(); persist(); render(); refreshPD(date); } }
const XLABEL = {klettern:'Climbing', ausgleich:'Cross-training', run:'Run'};
function extrasBlock(s){
  if (!s || (s.type !== 'rest' && !s.completed && !extrasOf(s).length)) { /* skipped main: still allow adding */ }
  const ex = extrasOf(s);
  return `<div class="xtra">
    ${ex.map(x => `<div class="xitem"><div class="xhead"><span class="badge ${x.type}">+ ${XLABEL[x.type]}</span>
      ${x.type === 'ausgleich' ? `<span class="xtpl">${['A','B'].map(t => `<button class="${x.template===t?'on':''}" onclick="setExtraTpl('${s.date}','${x.id}','${t}')">Plan ${t}</button>`).join('')}</span>` : ''}
      <button class="xdel" aria-label="Remove" onclick="removeExtra('${s.date}','${x.id}')">✕</button></div>
      ${x.type === 'klettern' && s.type !== 'klettern' ? boulderButton(s.date) : ''}
      ${x.type === 'run' && x.runId ? runSummaryLine(x.runId) : ''}
      ${s.date === TODAY ? sessionRpeRow(s, x) : ''}</div>`).join('')}
    <div class="xadd"><span class="fl">${s.type === 'rest' ? 'Trained after all?' : 'Another training today?'}</span>
      <button onclick="addExtra('${s.date}','klettern')"><img class="ico" src="/icons/ui/climb.png" alt="">+ Climb</button>
      <button onclick="addExtra('${s.date}','ausgleich')"><img class="ico" src="/icons/ui/train.png" alt="">+ Cross</button>
      ${s.date === TODAY ? `<button onclick="openRunTracker()"><img class="ico" src="/icons/ui/run.png" alt="">+ Run</button>` : ''}</div></div>`;
}
function computeDraftForType(type){
  const d = computeDraftBase(type);
  if (d.exercises && d.exercises.length) { const r = adaptExercises(d.exercises); d.exercises = r.kept; d.removed = r.removed; }
  return d;
}
function computeDraftBase(type){
  const before = sessions.filter(s => s.date < TODAY);
  let template = null, exercises = [], catchUp = false, note = '';
  if (type === 'ausgleich') {
    const count = crossCountBefore(TODAY);
    template = (count % 2 === 0) ? 'A' : 'B';
    const lastA = before.find(s => s.type === 'ausgleich');
    let ids = [...PLANS[template].ids];
    if (lastA && lastA.completed === false) {
      const missed = (lastA.template === 'A' || lastA.template === 'B') ? lastA.template : (template === 'A' ? 'B' : 'A');
      const add = catchUpFrom(missed).filter(id => !ids.includes(id));
      if (add.length) {
        catchUp = true;
        // drop the lowest-priority exercises (prio 3 first, from the end)
        const droppable = ids.map((id,i) => ({id,i,p:EX[id].prio})).sort((a,b) => b.p - a.p || b.i - a.i).slice(0, add.length).map(x => x.id);
        ids = ids.filter(id => !droppable.includes(id));
        exercises = add.map(id => exItem(id, {catchUp:true})).concat(ids.map(id => exItem(id)));
        note = `Adjusted: your last cross-training day (Plan ${missed}) was skipped, so its 2 key exercises are added first and ${droppable.length} lower-priority ones are paused today.`;
      }
    }
    if (!catchUp) exercises = ids.map(id => exItem(id));
  }
  return {type, template, exercises, catchUp, note};
}

/* ============ Actions ============ */
function saveToday(completed){
  const d = draft || computeDraftForType(suggestedTypeForToday());
  const body = { date:TODAY, type:d.type, template:d.template || null,
    exercises:(d.exercises||[]).map(e => ({...e, done: completed ? true : e.done})),
    completed:!!completed, catchUp:!!d.catchUp, updatedAt:Date.now() };
  if (keepExtras && d.type !== 'rest') body.extras = keepExtras; keepExtras = null;
  sessions = [body, ...sessions.filter(s => s.date !== TODAY)]; sortSessions(); persist();
  draft = null; render();
}
function setDone(idx, value){
  const existing = sessionFor(TODAY);
  if (existing) {
    const exercises = existing.exercises.map((e,i) => i===idx ? {...e, done: value===undefined ? !e.done : value} : e);
    sessions = sessions.map(s => s.date === TODAY ? {...s, exercises, updatedAt:Date.now()} : s); persist();
  } else if (draft) {
    draft = {...draft, exercises: draft.exercises.map((e,i) => i===idx ? {...e, done: value===undefined ? !e.done : value} : e)};
  }
  render();
}
function toggleExercise(idx){ setDone(idx); }
let keepExtras = null;
function reedit(){ const ex = sessionFor(TODAY); keepExtras = ex && ex.extras && ex.extras.length ? ex.extras : null; sessions = sessions.filter(s => s.date !== TODAY); persist(); draft = null; render(); }
function setType(type){ draft = computeDraftForType(type); render(); }
function showBanner(msg){ document.getElementById('banner').innerHTML = msg ? '<div class="banner">' + msg + '</div>' : ''; }

/* ============ Rendering ============ */
function exList(exercises, ctx){
  if (!exercises || !exercises.length) return '';
  return '<ul class="exlist">' + exercises.map((e,i) => {
    const m = exMeta(e);

}
function fmtShort(t){ return (t.reps||1) > 1 ? `${t.work}s×${t.reps}` : (t.work >= 60 ? Math.round(t.work/60)+'m' : t.work+'s'); }

function renderStats(){
  let streak = 0; for (const s of sessions) { if (s.completed || extrasOf(s).length) streak++; else break; }

  document.getElementById('statrow').innerHTML = `
    <div class="stat"><div class="n"><img src="/icons/ui/streak.png" alt="">${streak}</div><div class="l">day streak</div></div>
    <div class="stat"><div class="n">${rate}%</div><div class="l">completion, last 14 days</div></div>`;
}
function renderHistory(){
  const el = document.getElementById('dots'); const list = sessions.slice(0,14).reverse(); // oldest left → newest right

function savePastDay(){
  const date = PD.date;
  if (!date || date > TODAY || date < isoAdd(TODAY, -90)) { alert('Pick a date within the last 90 days.'); return; }
  const tpl = PD.type === 'ausgleich' ? PD.template : null;
  const body = { date, type:PD.type, template:tpl,
    exercises: tpl ? PLANS[tpl].ids.map(id => ({...exItem(id), done:!!PD.completed})) : [],
    completed: PD.type === 'rest' ? true : !!PD.completed, catchUp:false, updatedAt:Date.now(), addedLater:true,
    ...(PD.type !== 'rest' && PD.completed && PD.rpe ? {rpe:PD.rpe, mins:num(PD.mins)} : {}),
    ...(!PD.isNew && sessionFor(date) && extrasOf(sessionFor(date)).length ? {extras:extrasOf(sessionFor(date))} : {}) };
  sessions = [body, ...sessions.filter(s => s.date !== date)]; sortSessions(); persist();
  if (date === TODAY) draft = null;
  closeSheet(); render();
}
function deletePastDay(){
  if (!confirm('Delete the entry for ' + dayShort(PD.date) + '?')) return;
  sessions = sessions.filter(s => s.date !== PD.date); persist();
  if (PD.date === TODAY) draft = null;
  closeSheet(); render();
}
function planBlock(title, ids, cls){
  return `<div class="plan"><h3 class="${cls}">${title}</h3><ul>${ids.map(id => `<li>${esc(EX[id].name)} <span class="sets">— ${esc(EX[id].dose)}${EX[id].load ? ' · ' + esc(EX[id].load) : ''}</span></li>`).join('')}</ul></div>`;
}
function renderReference(){
  document.getElementById('refBody').innerHTML =
    planBlock(PLANS.A.title, PLANS.A.ids, 'a') + planBlock(PLANS.B.title, PLANS.B.ids, 'b') +
    `<div class="plan"><h3 class="a">Catch-up logic</h3><div class="note" style="margin:0">If a cross-training day is skipped, the next one starts with the missed plan's 2 key exercises (A: external rotation, push-up plus · B: finger extensor isometrics, eccentric wrist extension) and drops 2 lower-priority ones.</div></div>
    <div class="plan"><h3 class="b">Rest</h3><div class="note" style="margin:0"><b>Between sets:</b> 90 s for push-ups, overhead press, squats, split squats and leg raises (multi-joint, 8–12 reps); 45–60 s for the light shoulder, wrist and forearm exercises and planks (endurance-type sets). <b>Between exercises:</b> 90 s in the guided session — tap “Skip ›” if you're ready sooner.<br><b>Strength-training research (not climbing-specific):</b> the ACSM position stand (2009) recommends 1–2 min rest for moderate-load sets in novice/intermediate trainees, 2–3 min for heavy multi-joint lifts and under 1–2 min for endurance-type sets; a review (de Salles et al. 2009) found 3–5 min best for max strength and 30–60 s enough for moderate-intensity and endurance work. Exact seconds per exercise and the gap between exercises are practice.</div></div>
    <div class="plan"><h3 class="a">How heavy?</h3><div class="note" style="margin:0"><b>Rule:</b> pick the weight where the last 2 reps of a set feel hard but your form stays clean (about 2 reps left in the tank). When all sets feel easy, go up by the smallest step (0.5–2 kg).<br><b>Kilogram ranges</b> next to each exercise are typical starting points for adults — lighter or newer to lifting → lower end. Shoulder and wrist exercises (external rotation, Y-T-W, wrist extension, pronation) stay light on purpose: these small muscles are trained for control and tendon health, not max strength. With pain, stay at the lowest weight and ≤ 3/10.<br><i>Practice guidance — exact kilograms aren't tested in climbing studies.</i></div></div>
    <div class="plan"><h3 class="b">Why these exercises</h3><ul>
      <li><b>Climbing RCT:</b> closed-chain + eccentric strength work 3–4×/week cut shoulder (3.2 → 0.5) and elbow (1.8 → 0.5) injuries per 1,000 exposures in student climbers (Kozina et al.; small, moderate quality).</li>
      <li><b>Climbing study:</b> climbers' shoulder ER:IR ratio is ~0.8 vs ~1.0 in non-climbers → external rotation & scapular work.</li>
      <li><b>Climbing study:</b> finger flexors ~6× stronger than extensors; 5 s on / 6 s off extensor isometrics rebalanced this in 4 weeks.</li>
      <li><b>Climbing RCT:</b> 10 weeks of core training (side & prone bridges, foot-lifts, lock-offs) improved climbing-specific tests in advanced climbers.</li>
      <li><b>Climbing study:</b> hip abduction correlates with climbing level → straddle & frog stretches.</li>
      <li><b>Tendon research:</b> after hard loading, tendons break down collagen for ~18–36 h and rebuild it for up to 72 h; without enough rest, net collagen loss can make them vulnerable (Magnusson et al. 2010). Not climbing-specific, but it applies to finger tendons.</li>
      <li><b>Pain log:</b> based on the pain-monitoring model (RCT, Silbernagel et al. 2007): pain ≤ ~5/10 during loading is acceptable if it settles by the next morning and doesn't worsen week to week. ClimbR uses a stricter 3/10 for climbers. Sharp pain, a pop, swelling or pain > 2 weeks → see a professional.</li>
      <li><b>Rest-day rules (practice):</b> 3 training days in a row, 6 of 7 days, or fingers at 1–2 → rest suggested.</li>
      <li><b>Cochrane review:</b> stretching barely reduces muscle soreness (~1 point on a 100-point scale) — stretching on rest days is for mobility, not recovery.</li>
      <li><b>General sports science (no climbing data):</b> sets/reps, hold times and stretch duration.</li>
      <li>Not medical advice. Pain in fingers, elbows or shoulders → see a physio.</li></ul></div>`;
}

/* ============ Routines (built-in + custom) ============ */
const CUSTOM_KEY = 'climbr.custom.v1';
let customs = [];
function loadCustoms(){ try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch(e){ return []; } }
function persistCustoms(){ try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customs)); } catch(e){ showBanner('Saving failed — is storage full?'); } }
function getRoutine(key){
  if (ROUTINES[key]) { const r = ROUTINES[key]; const ad = adaptExercises(r.ids.map(id => ({...EX[id], id})));
    const extra = ad.removed.length ? 'Adjusted for pain — paused: ' + ad.removed.map(x => x.name).join(', ') + '. ' : '';
    return {...r, key, intro: extra + r.intro, items: ad.kept, custom:false}; }
  const c = customs.find(x => x.id === key); if (!c) return null;
  const mins = Math.max(1, Math.round(c.items.reduce((t,x) => t + (x.timer ? x.timer.work*(x.timer.sets||1)*(x.timer.sides||1)*(x.timer.reps||1) + (x.timer.setRest||0)*((x.timer.sets||1)-1) : 90), 0)/60));
  return {key, title:c.title, sub:`Custom · ~${mins} min`, intro:'', evidence:'', items:c.items, custom:true};
}
const ICONS = {warmup:'warmup', cooldown:'cooldown', stretch:'stretch'};
function renderRoutines(){

function openRoutine(key){

      <li class="ex"><span class="tx"><span class="nm">${esc(e.name)}</span><br><span class="sets">${esc(e.dose)}</span>${e.cue ? `<span class="cue">${esc(e.cue)}</span>` : ''}</span>
      ${e.timer ? `<button class="tbtn" onclick="runRoutine('${key}', ${i}, true)"><img class="ico" src="/icons/ui/timer.png" alt=""> ${fmtShort(e.timer)}</button>` : ''}</li>`).join('')}</ul>

/* ---- Builder ---- */
let B = null;
const LIB = [['Plan A', PLANS.A.ids], ['Plan B', PLANS.B.ids], ['Warm-up', ROUTINES.warmup.ids], ['Cool-down', ROUTINES.cooldown.ids], ['Stretching', ROUTINES.stretch.ids]];
function openBuilder(id){
  const c = id ? customs.find(x => x.id === id) : null;
  B = c ? JSON.parse(JSON.stringify(c)) : {id:'c' + Date.now(), title:'', items:[], isNew:true};

}
function drawBuilder(){
  const seen = new Set();
  const opts = LIB.map(([g, ids]) => `<optgroup label="${g}">${ids.filter(id => !seen.has(id) && seen.add(id)).map(id => `<option value="${id}">${esc(EX[id].name)} — ${esc(EX[id].dose)}</option>`).join('')}</optgroup>`).join('');
  document.getElementById('sheet').innerHTML = `<div class="wrap">
    <button class="close" onclick="${B.isNew ? 'closeSheet()' : `openRoutine('${B.id}')`}">← Back</button>

        <li class="ex"><span class="tx"><span class="nm">${esc(e.name)}</span><br><span class="sets">${esc(e.dose)}${e.timer ? ' · timer' : ''}</span></span>
        <button class="mini" onclick="moveItem(${i},-1)" aria-label="Move up">↑</button><button class="mini" onclick="moveItem(${i},1)" aria-label="Move down">↓</button><button class="mini" onclick="removeItem(${i})" aria-label="Remove">✕</button></li>`).join('')}</ul>` : '<div class="hint">No exercises yet — add some below.</div>'}

      <div class="field"><label>Type</label><select id="oMode" onchange="document.getElementById('oTimed').hidden=this.value!=='timed';document.getElementById('oReps').hidden=this.value==='timed'">
        <option value="reps">Sets × reps (tick off)</option><option value="timed">Timed (with timer)</option></select></div>
      <div class="field" id="oReps"><label>Dose</label><input id="oDose" placeholder="e.g. 3 × 10"></div>
      <div id="oTimed" hidden><div class="row">
        <div class="field"><label>Seconds</label><input id="oWork" type="number" inputmode="numeric" value="30" min="1"></div>
        <div class="field"><label>Sets</label><input id="oSets" type="number" inputmode="numeric" value="3" min="1"></div>
        <div class="field"><label>Sides</label><select id="oSides"><option value="1">1</option><option value="2">2 (L/R)</option></select></div>
        <div class="field"><label>Rest s</label><input id="oRest" type="number" inputmode="numeric" value="30" min="0"></div>
      </div></div>
      <div class="field"><label>Note (optional)</label><input id="oCue" placeholder="Technique cue"></div>
      <button class="btn" onclick="addOwn()">+ Add exercise</button>
    </div>
    <button class="btn main" onclick="saveBuilder()">Save routine</button>
    ${B.isNew ? '' : `<button class="btn danger" onclick="deleteRoutine()">Delete routine</button>`}
  </div>`;
}
function keepTitle(){ const t = document.getElementById('bTitle'); if (t) B.title = t.value; }
function addLib(){ keepTitle(); const id = document.getElementById('bLib').value; const e = EX[id]; B.items.push({name:e.name, dose:e.dose, cue:e.cue, ...(e.timer ? {timer:{...e.timer}} : {})}); drawBuilder(); }
function addOwn(){
  keepTitle();
  const name = document.getElementById('oName').value.trim(); if (!name) { alert('Give the exercise a name.'); return; }
  const cue = document.getElementById('oCue').value.trim();
  if (document.getElementById('oMode').value === 'timed') {
    const work = Math.max(1, +document.getElementById('oWork').value || 30), sets = Math.max(1, +document.getElementById('oSets').value || 1);
    const sides = +document.getElementById('oSides').value || 1, rest = Math.max(0, +document.getElementById('oRest').value || 0);
    B.items.push({name, cue, dose:`${sets} × ${work} s${sides > 1 ? ' / side' : ''}`, timer:{work, sets, sides, setRest:rest, switchRest:5}});
  } else {
    B.items.push({name, cue, dose: document.getElementById('oDose').value.trim() || '—'});
  }
  drawBuilder();
}
function moveItem(i, d){ keepTitle(); const j = i + d; if (j < 0 || j >= B.items.length) return; [B.items[i], B.items[j]] = [B.items[j], B.items[i]]; drawBuilder(); }
function removeItem(i){ keepTitle(); B.items.splice(i, 1); drawBuilder(); }

  keepTitle(); B.title = (B.title || '').trim();
  if (!B.title) { alert('Give your routine a name.'); return; }

  const {isNew, ...c} = B; customs = customs.filter(x => x.id !== c.id).concat([c]); persistCustoms(); renderRoutines(); openRoutine(c.id);

/* ============ Timer / guided runner ============ */
// Build phases for one exercise
function phasesFor(t){
  const ph = [], sides = t.sides || 1, reps = t.reps || 1, sideName = ['Left side','Right side'];
  for (let s = 1; s <= t.sets; s++) {
    for (let sd = 0; sd < sides; sd++) {
      for (let r = 1; r <= reps; r++) {
        const info = [t.sets > 1 ? `${t.setName || 'Set'} ${s}/${t.sets}` : '', sides > 1 ? sideName[sd] : '', reps > 1 ? `Rep ${r}/${reps}` : ''].filter(Boolean).join(' · ');
        ph.push({kind:'work', label: t.workLabel || (reps > 1 ? 'Push' : 'Go'), secs:t.work, info, alert:t.alert});
        if (r < reps && t.rest) ph.push({kind:'rest', label:'Rest', secs:t.rest, info});
      }
      if (sd < sides - 1) ph.push({kind:'rest', label:'Switch sides', secs:t.switchRest || 5, info:''});
    }
    if (s < t.sets && t.setRest) ph.push({kind:'rest', label:t.restLabel || 'Rest', secs:t.setRest, info:`Next: ${(t.setName || 'set').toLowerCase()} ${s+1}/${t.sets}`, alert:t.alert});
  }
  return ph;
}

const T = { queue:[], qi:0, phases:[], pi:0, left:0, paused:false, tick:null, onDone:null, lock:null, endAt:0 };
let audioCtx = null;
function beep(freq, dur){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
function buzz(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
async function wakeLock(on){
  try { if (on && 'wakeLock' in navigator) T.lock = await navigator.wakeLock.request('screen'); else if (!on && T.lock) { await T.lock.release(); T.lock = null; } } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.getElementById('timer').hidden) wakeLock(true); });

// queue items: {id, onComplete}
function startRunner(items, startIdx, gap){
  T.queue = items; T.qi = startIdx || 0; T.gap = gap || 0; T.after = null; document.getElementById('timer').hidden = false;
  beep(660, .05); // unlock audio on user gesture
  wakeLock(true); loadItem();
}
function exOf(it){ return it.ex || EX[it.id]; }
function loadItem(){
  clearInterval(T.tick);
  if (T.qi >= T.queue.length) return finishRunner();
  const it = T.queue[T.qi], e = exOf(it); T.drawn = null; T.after = null; T.set = 1;
  if (e.timer) { T.phases = [{kind:'ready', label:e.timer.readyLabel || 'Get ready', secs:e.timer.ready || 5, info:''}].concat(phasesFor(e.timer)); T.pi = 0; startPhase(); }
  else { T.phases = []; drawManual(); }
}
function startPhase(){
  const p = T.phases[T.pi]; T.left = p.secs; T.paused = false; T.endAt = Date.now() + p.secs*1000;
  if (p.kind === 'work') { beep(880, .25); buzz(200); } else if (T.pi > 0) { beep(520, .2); buzz([80,60,80]); }
  drawTimer(); clearInterval(T.tick); T.tick = setInterval(tickFn, 200);
}
function tickFn(){
  if (T.paused) return;
  const left = Math.max(0, Math.ceil((T.endAt - Date.now())/1000));
  if (left !== T.left) {
    T.left = left; const ph = T.phases[T.pi];
    if (left > 0 && left <= 3) beep(700, .08);
    if (ph.alert && (left === 60 || left === 30) && ph.secs > left + 5) { beep(600, .12); buzz(120); } // 1-min and 30-s warnings
    drawTimer();
  }
  if (left <= 0) nextPhase();
}
function nextPhase(){
  clearInterval(T.tick);
  if (T.pi < T.phases.length - 1) { T.pi++; startPhase(); }
  else if (T.after) { const f = T.after; T.after = null; f(); }
  else { completeItem(); }
}
function completeItem(){
  const it = T.queue[T.qi]; beep(990, .15); setTimeout(() => beep(1320, .3), 160); buzz([150,80,150]);
  if (it.onComplete) it.onComplete();
  T.qi++;
  if (T.qi < T.queue.length && T.gap) restPhase(T.gap, 'Get set up for the next exercise', loadItem, 'Rest · next exercise');
  else loadItem();
}
// a rest countdown outside an exercise's own phases (between sets of rep exercises, between exercises)
function restPhase(secs, info, after, label){
  clearInterval(T.tick); T.drawn = null;
  T.phases = [{kind:'rest', label:label || 'Rest', secs, info, alert:secs >= 60}]; T.pi = 0; T.after = after;
  beep(520, .2); buzz([80,60,80]); startPhase();
}
function manualSets(e){ const m = /^(\d+)\s*×/.exec(e.dose || ''); return m ? +m[1] : 1; }
function manualSetDone(){
  const e = exOf(T.queue[T.qi]), n = manualSets(e);
  if (T.set < n) { if (e.sr) restPhase(e.sr, `Next: set ${T.set + 1}/${n}`, () => { T.set++; drawManual(); }); else { T.set++; drawManual(); } }
  else completeItem();
}
function skipExercise(){ clearInterval(T.tick); T.after = null; T.qi++; loadItem(); }
function togglePause(){
  if (T.paused) { T.paused = false; T.endAt = Date.now() + T.left*1000; }
  else { T.paused = true; }
  drawTimer();
}
function addTime(s){ if (!T.paused) T.endAt += s*1000; T.left += s; drawTimer(); }
function closeRunner(){ clearInterval(T.tick); T.after = null; wakeLock(false); document.getElementById('timer').hidden = true; render(); }
function finishRunner(){
  clearInterval(T.tick); wakeLock(false);
  const el = document.getElementById('timer'); el.className = 'timer rest';
  el.innerHTML = `<div class="tprog">Finished</div>
    <div><div class="tdose">Nice work ✓</div><div class="tcue">${T.queue.length > 1 ? 'All exercises completed.' : 'Exercise completed.'}</div></div>
    <div class="tbtns"><button class="main" onclick="closeRunner()">Close</button></div>`;
}
function header(){
  const it = T.queue[T.qi], e = exOf(it);
  const next = T.queue[T.qi+1] ? exOf(T.queue[T.qi+1]).name : '';
  return `<div><div class="tprog">${T.queue.length > 1 ? `Exercise ${T.qi+1}/${T.queue.length}` : esc(e.dose)}</div>
    <div class="tname">${esc(e.name)}</div>${e.load ? `<div class="tload">Weight: ${esc(e.load)}</div>` : ''}<div class="tcue">${esc(e.cue)}</div>${next ? `<div class="tsub">Next: ${esc(next)}</div>` : ''}</div>`;
}
function drawTimer(){
  const el = document.getElementById('timer'), p = T.phases[T.pi];
  const key = T.qi + ':' + T.pi + ':' + T.paused;
  if (T.drawn === key) { // only refresh the clock so taps on buttons never get lost
    const c = el.querySelector('.tclock');
    if (c) { c.textContent = T.left >= 60 ? `${Math.floor(T.left/60)}:${String(T.left%60).padStart(2,'0')}` : String(T.left); return; }
  }
  T.drawn = key;
  el.className = 'timer ' + (p.kind === 'work' ? 'work' : 'rest');
  const m = Math.floor(T.left/60), s = T.left % 60;
  const clock = T.left >= 60 ? `${m}:${String(s).padStart(2,'0')}` : String(T.left);
  const pct = Math.round(100 * (T.pi) / T.phases.length);
  el.innerHTML = header() + `
    <div><div class="tphase">${esc(p.label)}${T.paused ? ' · paused' : ''}</div><div class="tclock">${clock}</div><div class="tsub">${esc(p.info || '')}</div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px;align-items:center">
      <div class="tbtns"><button onclick="addTime(10)">+10 s</button><button class="main" onclick="togglePause()">${T.paused ? 'Resume' : 'Pause'}</button><button onclick="nextPhase()">Skip ›</button></div>
      <div class="tbtns"><button onclick="closeRunner()">✕ Stop</button>${T.queue.length > 1 ? `<button onclick="skipExercise()">Skip exercise »</button>` : ''}</div>
    </div>`;
}
function drawManual(){
  T.drawn = null;
  const el = document.getElementById('timer'), e = exOf(T.queue[T.qi]);
  el.className = 'timer manual';
  const n = manualSets(e), last = T.set >= n;
  el.innerHTML = header() + `<div><div class="tphase">${n > 1 ? `Set ${T.set}/${n} · your pace` : 'Your pace'}</div><div class="tdose">${esc(e.dose)}</div>${e.sr && n > 1 ? `<div class="tsub">${e.sr} s rest between sets</div>` : ''}</div>
    <div style="width:100%;display:flex;flex-direction:column;gap:10px;align-items:center">
      <div class="tbtns"><button class="main" onclick="manualSetDone()"><img class="ico inv" src="/icons/ui/done.png" alt=""> ${last ? 'Done — next' : `Set ${T.set} done`}</button></div>
      <div class="tbtns"><button onclick="closeRunner()">✕ Stop</button>${T.queue.length > 1 ? `<button onclick="skipExercise()">Skip exercise »</button>` : ''}</div>
    </div>`;
}

// Today's plan: single exercise (idx) or guided session (all not done)
function currentExercises(){ const ex = sessionFor(TODAY); return ex ? ex.exercises : (draft ? draft.exercises : []); }
function runToday(idx){
  const list = currentExercises();
  let picks = idx === undefined ? list.map((e,i) => ({e,i})).filter(x => !x.e.done && exMeta(x.e)) : [{e:list[idx], i:idx}];
  if (!picks.length) picks = list.map((e,i) => ({e,i})).filter(x => exMeta(x.e));
  if (!picks.length) return;
  startRunner(picks.map(x => ({id:x.e.id, onComplete:() => setDone(x.i, true)})), 0, picks.length > 1 ? 90 : 0);
}
function runRoutine(key, idx, single){
  const r = getRoutine(key); if (!r) return;
  const items = (single ? [r.items[idx]] : r.items).map(ex => ({ex}));
  startRunner(items, 0, single ? 0 : 15);
}
