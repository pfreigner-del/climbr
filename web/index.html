  const rec = { id:RF.id, title, crag:document.getElementById('rfCrag').value.trim(), system:sys, grade:document.getElementById('rfGrade').value,
    style:document.getElementById('rfStyle').value, kind:document.getElementById('rfKind').value, date:document.getElementById('rfDate').value || TODAY,
    notes:document.getElementById('rfNotes').value.trim(), lat:pos ? pos.lat : null, lng:pos ? pos.lng : null, acc:pos ? RF.acc : null, photo,
    created:RF.created || Date.now(), updated:Date.now() };
  outdoor = outdoor.filter(x => x.id !== rec.id).concat([rec]); saveOutdoor();
  renderOutdoor(); openRoute(rec.id);
}
async function deleteRoute(){
  if (!confirm('Delete "' + RF.title + '"?')) return;
  if (RF.photo) await photoDel(RF.photo);
  outdoor = outdoor.filter(x => x.id !== RF.id); saveOutdoor(); closeSheet(); renderOutdoor();
}
async function outdoorBackup(){
  const photos = {};
  for (const r of outdoor) if (r.photo) { const b = await photoGet(r.photo); if (b) photos[r.photo] = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); }); }
  return {routes:outdoor, photos};
}
async function outdoorRestore(data){
  if (!data || !Array.isArray(data.routes)) return 0;
  const have = new Set(outdoor.map(r => r.id)); let n = 0;
  for (const r of data.routes) { if (!r || !r.id || have.has(r.id)) continue;
    if (r.photo && data.photos && data.photos[r.photo]) { try { await photoPut(r.photo, await (await fetch(data.photos[r.photo])).blob()); } catch(e){ r.photo = null; } } else r.photo = null;
    outdoor.push(r); n++; }
  saveOutdoor(); renderOutdoor(); return n;
}


/* ============ Week plan ============ */
const WEEK_KEY = 'climbr.week.v1';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const WTYPES = {klettern:{label:'Climb', icon:'climb'}, ausgleich:{label:'Cross', icon:'train'}, rest:{label:'Rest', icon:'rest'}};
const PRESETS = [
  {name:'Auto (every other day)', desc:'Alternates climbing and cross-training; suggests rest when needed.', days:null},
  {name:'3× climbing', desc:'Mon · Wed · Fri climbing, Tue · Sat cross-training, Thu · Sun rest.', days:['klettern','ausgleich','klettern','rest','klettern','ausgleich','rest']},
  {name:'Weekend at the crag', desc:'Sat · Sun climbing, Tue · Thu cross-training, rest in between.', days:['rest','ausgleich','rest','ausgleich','rest','klettern','klettern']},
  {name:'2× climbing, 2× cross', desc:'Tue · Fri climbing, Mon · Thu cross-training, rest Wed · Sat · Sun.', days:['ausgleich','klettern','rest','ausgleich','klettern','rest','rest']},
];
let week = {days:null};
try { week = JSON.parse(localStorage.getItem(WEEK_KEY) || '{"days":null}'); } catch(e){ week = {days:null}; }
function dowIndex(iso){ const [y,m,d] = iso.split('-').map(Number); return (new Date(y, m-1, d).getDay() + 6) % 7; } // Mon=0
function plannedType(iso){ return week && Array.isArray(week.days) ? week.days[dowIndex(iso)] : null; }
function longestRun(days){ let best = 0, cur = 0; for (const d of days.concat(days)) { if (d !== 'rest') { cur++; best = Math.max(best, cur); } else cur = 0; } return Math.min(best, 7); }
function renderWeek(){
  const el = document.getElementById('weekStrip'); if (!el) return;
  const ti = dowIndex(TODAY);
  if (!week.days) {
    el.innerHTML = `<div class="wh"><span class="wt">Week plan · Auto</span><button onclick="openWeek()">Set week plan</button></div>

    <div class="wdays">${week.days.map((t,i) => `<div class="wd ${i===ti?'today':''}"><span class="dn">${DAYS[i]}</span><img src="/icons/ui/${WTYPES[t].icon}.png" alt=""><span class="dx">${WTYPES[t].label}</span></div>`).join('')}</div>`;
}
let WK = null;
function openWeek(){
  WK = week.days ? [...week.days] : [...PRESETS[1].days];
  drawWeek(); const sh = document.getElementById('sheet'); sh.hidden = false; sh.scrollTop = 0;
}
function drawWeek(){
  const run = longestRun(WK);
  document.getElementById('sheet').innerHTML = `<div class="wrap">
    <button class="close" onclick="closeSheet()">← Back</button>
    <header><div class="eyebrow">Training</div><h1>Week plan</h1></header>

    <div class="presets">${PRESETS.map((p,i) => `<button onclick="applyPreset(${i})"><b>${esc(p.name)}</b><span>${esc(p.desc)}</span></button>`).join('')}</div>
    <div class="box2"><h3>Custom days</h3>
      ${DAYS.map((d,i) => `<div class="wrow"><span class="wl">${d}</span><div class="wpick">${Object.entries(WTYPES).map(([k,v]) => `<button class="${WK[i]===k?'on':''}" onclick="setWeekDay(${i},'${k}')">${v.label}</button>`).join('')}</div></div>`).join('')}
    </div>
    ${run >= 3 ? `<div class="fnote">${run} training days in a row. Finger tendons rebuild for 1–3 days after hard loading — consider a rest day in between.</div>` : ''}
    ${WK.filter(x => x === 'klettern').length >= 5 ? `<div class="fnote">5+ climbing days a week is a lot for fingers and elbows — keep most of them easy.</div>` : ''}
    <button class="btn main" onclick="saveWeek()">Save week plan</button>

}
function setWeekDay(i, k){ WK[i] = k; const y = document.getElementById('sheet').scrollTop; drawWeek(); document.getElementById('sheet').scrollTop = y; }
function applyPreset(i){
  if (!PRESETS[i].days) { week = {days:null}; persistWeek(); closeSheet(); return; }

}
function saveWeek(){ week = {days:[...WK]}; persistWeek(); closeSheet(); }
function persistWeek(){ try { localStorage.setItem(WEEK_KEY, JSON.stringify(week)); } catch(e){} if (draft && draft.auto && !sessionFor(TODAY)) draft = null; render(); }

/* ============ Boulder log ============ */
const BLD_KEY = 'climbr.boulders.v1';
const BSYS = {Font: GRADES.Font, V: GRADES.V, Gym: ['1','2','3','4','5','6','7','8']};
const BSYS_LABEL = {Font:'Font', V:'V-scale', Gym:'Gym 1–8'};
const RES = {flash:{l:'Flash', ico:'flash'}, send:{l:'Sent', ico:'sent'}, try:{l:'Not sent', ico:'project'}};
let boulders = {};
try { boulders = JSON.parse(localStorage.getItem(BLD_KEY) || '{}') || {}; } catch(e){ boulders = {}; }
function saveBoulders(){ try { localStorage.setItem(BLD_KEY, JSON.stringify(boulders)); } catch(e){ alert('Saving failed — storage full?'); } }
function bFor(date){ return boulders[date] || []; }
function bCount(list){ const c = {n:list.length, flash:0, send:0, try:0}; list.forEach(b => c[b.r]++); c.sent = c.flash + c.send; return c; }
function bSysPref(){ try { const s = localStorage.getItem('climbr.boulderSys'); if (BSYS[s]) return s; } catch(e){} return 'Font'; }
function gIdx(sys, g){ return BSYS[sys] ? BSYS[sys].indexOf(g) : -1; }
function boulderButton(date){
  const n = bFor(date).length;
  return `<button class="guided" onclick="openBoulders('${date}')"><img class="ico inv" src="/icons/ui/boulder.png" alt=""> Log boulders${n ? ' · ' + n + ' logged' : ''}</button>`;
}
let BL = null;
function openBoulders(date){
  const list = bFor(date), last = list[list.length - 1];
  const sys = last ? last.sys : bSysPref();
  BL = {date, sys, g: last && last.sys === sys ? last.g : BSYS[sys][Math.min(5, BSYS[sys].length - 1)]};
  drawBoulders(); const sh = document.getElementById('sheet'); sh.hidden = false; sh.scrollTop = 0;
}
function drawBoulders(){
  const list = bFor(BL.date), c = bCount(list), grades = BSYS[BL.sys];
  document.getElementById('sheet').innerHTML = `<div class="wrap">
    <button class="close" onclick="closeBoulders()">← Back</button>
    <header><div class="eyebrow">Boulder log</div><h1>${BL.date === TODAY ? 'Today' : esc(fmtDate(BL.date))}</h1></header>
    <div class="field"><label>Date</label><input type="date" value="${BL.date}" min="${isoAdd(TODAY,-365)}" max="${TODAY}" onchange="if(this.value){BL.date=this.value;drawBoulders()}"></div>
    <div class="bsum">
      <div><b>${c.n}</b><span>boulders</span></div>
      <div><b>${c.flash}</b><span>flashed</span></div>
      <div><b>${c.sent}</b><span>sent</span></div>
      <div><b>${c.try}</b><span>not sent</span></div></div>
    <div class="wrow"><span class="wl">Grade system</span><div class="wpick">
      ${Object.keys(BSYS).map(s => `<button class="${BL.sys===s?'on':''}" onclick="setBSys('${s}')">${BSYS_LABEL[s]}</button>`).join('')}</div></div>
    <div class="wrow"><span class="wl">1 · Pick the grade</span>
      <div class="ggrid ${BL.sys}">${grades.map(g => `<button class="${BL.g===g?'on':''}" onclick="BL.g='${g}';drawBoulders()">${esc(g)}</button>`).join('')}</div></div>
    <div class="wrow"><span class="wl">2 · Log it as</span><div class="rbtns">
      ${Object.keys(RES).map(r => `<button class="r-${r}" onclick="addBoulder('${r}')"><img class="ico" src="/icons/ui/${RES[r].ico}.png" alt="">${RES[r].l}</button>`).join('')}</div></div>
    <div class="hint">Flash = topped on the first try. Sent = topped after more tries. Not sent = tried, didn't top (yet).</div>
    ${list.length ? `<ul class="blist">${list.map((b,i) => ({b,i})).reverse().map(({b,i}) => `<li><img class="ico" src="/icons/ui/${RES[b.r].ico}.png" alt=""><b>${esc(b.g)}</b><span class="br">${RES[b.r].l}</span><span class="bs">${BSYS_LABEL[b.sys]}</span><button aria-label="Remove" onclick="removeBoulder(${i})">✕</button></li>`).join('')}</ul>` : ''}
    <button class="btn main" onclick="closeBoulders()">Done</button>
  </div>`;
}
function setBSys(s){ BL.sys = s; if (gIdx(s, BL.g) < 0) BL.g = BSYS[s][Math.min(5, BSYS[s].length - 1)]; try { localStorage.setItem('climbr.boulderSys', s); } catch(e){} drawBoulders(); }
function addBoulder(r){
  if (!BL.g) return;
  (boulders[BL.date] = boulders[BL.date] || []).push({sys:BL.sys, g:BL.g, r, at:Date.now()});
  saveBoulders(); markClimbed(BL.date);
  try { navigator.vibrate && navigator.vibrate(15); } catch(e){}
  drawBoulders();
}
function removeBoulder(i){
  const list = bFor(BL.date); list.splice(i, 1);
  if (!list.length) delete boulders[BL.date];
  saveBoulders(); drawBoulders();
}
// Logging boulders means you climbed that day: create / complete the climbing entry.
function markClimbed(date){
  if (date < isoAdd(TODAY, -365)) return;
  const s = sessionFor(date);
  if (!s) {
    sessions.push({date, type:'klettern', template:null, exercises:[], completed:true, catchUp:false, updatedAt:Date.now(), addedLater: date !== TODAY});
    sortSessions(); persist(); if (date === TODAY) draft = null;
  } else if (s.type === 'klettern' && !s.completed) { s.completed = true; s.updatedAt = Date.now(); persist(); }
}
function closeBoulders(){ closeSheet(); render(); if (!document.getElementById('tabStats').hidden) renderAnalytics(); }

/* ============ Analytics ============ */
const AN = {period:'month', anchor:TODAY, sys:null};
const PERIODS = [['day','Day'],['week','Week'],['month','Month'],['year','Year'],['all','All']];
function isoDate(t){ return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
function parseISO(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function anRange(){
  const a = parseISO(AN.anchor);
  if (AN.period === 'day') return [AN.anchor, AN.anchor];
  if (AN.period === 'week') { const dow = (a.getDay() + 6) % 7; const s = isoAdd(AN.anchor, -dow); return [s, isoAdd(s, 6)]; }
  if (AN.period === 'month') return [isoDate(new Date(a.getFullYear(), a.getMonth(), 1)), isoDate(new Date(a.getFullYear(), a.getMonth()+1, 0))];
  if (AN.period === 'year') return [a.getFullYear() + '-01-01', a.getFullYear() + '-12-31'];
  const dates = Object.keys(boulders).concat(sessions.map(s => s.date)).sort();
  return [dates[0] || TODAY, TODAY];
}
function anLabel([s, e]){
  const a = parseISO(AN.anchor);
  if (AN.period === 'day') return fmtDate(AN.anchor);
  if (AN.period === 'week') { const o = {day:'numeric', month:'short'}; return parseISO(s).toLocaleDateString('en-GB', o) + ' – ' + parseISO(e).toLocaleDateString('en-GB', o); }
  if (AN.period === 'month') return a.toLocaleDateString('en-GB', {month:'long', year:'numeric'});
  if (AN.period === 'year') return String(a.getFullYear());
  return 'All time';
}
function anShift(dir){
  const a = parseISO(AN.anchor);
  if (AN.period === 'day') AN.anchor = isoAdd(AN.anchor, dir);
  else if (AN.period === 'week') AN.anchor = isoAdd(AN.anchor, 7 * dir);
  else if (AN.period === 'month') AN.anchor = isoDate(new Date(a.getFullYear(), a.getMonth() + dir, 1));
  else if (AN.period === 'year') AN.anchor = isoDate(new Date(a.getFullYear() + dir, 0, 1));
  if (AN.anchor > TODAY) AN.anchor = TODAY;
  renderAnalytics();
}
function anSetPeriod(p){ AN.period = p; if (p !== 'day') AN.anchor = AN.anchor > TODAY ? TODAY : AN.anchor; renderAnalytics(); }
function anOpenDay(d){ AN.period = 'day'; AN.anchor = d; renderAnalytics(); window.scrollTo(0, 0); }
function bouldersIn(s, e){ const out = []; for (const d of Object.keys(boulders)) if (d >= s && d <= e) for (const b of boulders[d]) out.push({...b, date:d}); return out; }
function topGrade(list, sys, pred){ let best = -1, g = null; for (const b of list) if (b.sys === sys && pred(b)) { const i = gIdx(sys, b.g); if (i > best) { best = i; g = b.g; } } return g; }
function pct(a, b){ return b ? Math.round(100 * a / b) + '%' : '–'; }
function renderAnalytics(){
  const [s, e] = anRange(), all = bouldersIn(s, e);
  const sysCount = {}; all.forEach(b => sysCount[b.sys] = (sysCount[b.sys] || 0) + 1);
  if (!AN.sys || (!sysCount[AN.sys] && all.length)) AN.sys = Object.keys(sysCount).sort((x,y) => sysCount[y] - sysCount[x])[0] || bSysPref();
  const sys = AN.sys, list = all.filter(b => b.sys === sys), c = bCount(list);
  const canNext = AN.period !== 'all' && e < TODAY;
  document.getElementById('anPeriod').innerHTML = PERIODS.map(([k,l]) => `<button class="${AN.period===k?'on':''}" onclick="anSetPeriod('${k}')">${l}</button>`).join('');
  document.getElementById('anNav').innerHTML = AN.period === 'all' ? `<span class="anl">All time</span>` :
    `<button aria-label="Previous" onclick="anShift(-1)">‹</button>
     ${AN.period === 'day' ? `<input type="date" value="${AN.anchor}" max="${TODAY}" onchange="if(this.value){AN.anchor=this.value;renderAnalytics()}">` : `<span class="anl">${esc(anLabel([s,e]))}</span>`}
     <button aria-label="Next" onclick="anShift(1)" ${canNext ? '' : 'disabled'}>›</button>`;
  const shown = Object.keys(BSYS).filter(k => sysCount[k]);
  document.getElementById('anSys').innerHTML = shown.length < 2 ? '' : shown.map(k => `<button class="${sys===k?'on':''}" onclick="AN.sys='${k}';renderAnalytics()">${BSYS_LABEL[k]}${sysCount[k] ? ' · ' + sysCount[k] : ''}</button>`).join('');

  let h = '';
  if (AN.period === 'day') h += boulderButton(AN.anchor);
  if (!list.length) {
    h += `<div class="anempty">${all.length ? 'No ' + BSYS_LABEL[sys] + ' boulders here — switch the grade system above.' : 'No boulders logged ' + (AN.period === 'day' ? 'on this day.' : 'in this period.') + (AN.period !== 'day' ? ' Log them on a climbing day via “Log boulders”.' : '')}</div>`;
  } else {
    const days = [...new Set(list.map(b => b.date))].sort().reverse();
    const topSend = topGrade(list, sys, b => b.r !== 'try'), topFlash = topGrade(list, sys, b => b.r === 'flash');
    h += `<div class="antiles">
      <div class="stat"><div class="n">${c.n}</div><div class="l">boulders${AN.period !== 'day' ? ' · ' + days.length + ' day' + (days.length === 1 ? '' : 's') : ''}</div></div>
      <div class="stat"><div class="n"><img src="/icons/ui/flash.png" alt="">${c.flash}</div><div class="l">flashed · ${pct(c.flash, c.n)}</div></div>
      <div class="stat"><div class="n"><img src="/icons/ui/sent.png" alt="">${c.sent}</div><div class="l">sent · ${pct(c.sent, c.n)}</div></div>
      <div class="stat"><div class="n"><img src="/icons/ui/project.png" alt="">${c.try}</div><div class="l">not sent</div></div>
      <div class="stat"><div class="n">${topSend ? esc(topSend) : '–'}</div><div class="l">hardest send</div></div>
      <div class="stat"><div class="n">${topFlash ? esc(topFlash) : '–'}</div><div class="l">hardest flash</div></div></div>`;
    h += pyramid(list, sys);
    if (AN.period !== 'day') h += volumeChart(list, s, e);
    if (AN.period !== 'day') h += `<section class="ansec"><h2>Climbing days</h2><ul class="andays">${days.map(d => { const dl = list.filter(b => b.date === d), dc = bCount(dl), tg = topGrade(dl, sys, b => b.r !== 'try');
      return `<li><button onclick="anOpenDay('${d}')"><span class="ad">${esc(parseISO(d).toLocaleDateString('en-GB', {weekday:'short', day:'2-digit', month:'2-digit'}))}</span><span class="am">${dc.n} · ${dc.flash} flash · ${dc.sent} sent</span><span class="ag">${tg ? esc(tg) : '–'}</span></button></li>`; }).join('')}</ul></section>`;
    else h += `<section class="ansec"><h2>Boulders this day</h2><ul class="blist">${list.map(b => `<li><img class="ico" src="/icons/ui/${RES[b.r].ico}.png" alt=""><b>${esc(b.g)}</b><span class="br">${RES[b.r].l}</span></li>`).join('')}</ul></section>`;
  }
  h += trainingSummary(s, e);
  document.getElementById('anBody').innerHTML = h;
  document.getElementById('anSub').textContent = AN.period === 'all' ? 'All time' : anLabel([s, e]);
}
function pyramid(list, sys){
  const rows = {}; list.forEach(b => { const r = rows[b.g] = rows[b.g] || {flash:0, send:0, try:0}; r[b.r]++; });
  const gs = Object.keys(rows).sort((a,b) => gIdx(sys, b) - gIdx(sys, a));
  const max = Math.max(...gs.map(g => rows[g].flash + rows[g].send + rows[g].try));
  return `<section class="ansec"><h2>Grade pyramid</h2>
    <div class="alegend"><span><i class="k-flash"></i>Flash</span><span><i class="k-send"></i>Sent</span><span><i class="k-try"></i>Not sent</span></div>
    <div class="pyr">${gs.map(g => { const r = rows[g], t = r.flash + r.send + r.try;
      const seg = k => r[k] ? `<i class="k-${k}" style="width:${100 * r[k] / max}%" title="${RES[k].l}: ${r[k]}"></i>` : '';
      return `<div class="prow" aria-label="${esc(g)}: ${r.flash} flash, ${r.send} sent, ${r.try} not sent"><span class="pg">${esc(g)}</span><span class="pb">${seg('flash')}${seg('send')}${seg('try')}</span><span class="pn">${r.flash + r.send}/${t}</span></div>`; }).join('')}</div>
    <div class="hint">Right: sent / tried per grade.</div></section>`;
}
function volumeChart(list, s, e){
  // buckets: week → days, month → weeks, longer → months
  const days = Math.round((parseISO(e) - parseISO(s)) / 864e5) + 1;
  let buckets = [];
  if (days <= 7) { for (let i = 0; i < 7; i++) { const d = isoAdd(s, i); buckets.push({s:d, e:d, l:parseISO(d).toLocaleDateString('en-GB', {weekday:'narrow'})}); } }
  else if (days <= 31) { let d = s; while (d <= e) { const dow = (parseISO(d).getDay() + 6) % 7, end = isoAdd(d, 6 - dow); buckets.push({s:d, e:end > e ? e : end, l:String(parseISO(d).getDate())}); d = isoAdd(end, 1); } }
  else { let a = parseISO(s); a = new Date(a.getFullYear(), a.getMonth(), 1); while (isoDate(a) <= e) { const b = new Date(a.getFullYear(), a.getMonth() + 1, 0); buckets.push({s:isoDate(a), e:isoDate(b), l:a.toLocaleDateString('en-GB', {month:'narrow'})}); a = new Date(a.getFullYear(), a.getMonth() + 1, 1); } }
  if (buckets.length > 24) buckets = buckets.slice(-24);
  buckets.forEach(b => { const bl = list.filter(x => x.date >= b.s && x.date <= b.e); b.c = bCount(bl); });
  const max = Math.max(1, ...buckets.map(b => b.c.n));
  return `<section class="ansec"><h2>Volume</h2>
    <div class="vol">${buckets.map(b => `<div class="vcol" title="${b.c.n} boulders · ${b.c.flash} flash · ${b.c.sent} sent"><span class="vn">${b.c.n || ''}</span><span class="vb">
      <i class="k-try" style="height:${100 * b.c.try / max}%"></i><i class="k-send" style="height:${100 * b.c.send / max}%"></i><i class="k-flash" style="height:${100 * b.c.flash / max}%"></i></span><span class="vl">${esc(b.l)}</span></div>`).join('')}</div>
    <div class="hint">Boulders per ${days <= 7 ? 'day' : days <= 31 ? 'week (labelled by start date)' : 'month'}, same colours as above.</div></section>`;
}
function trainingSummary(s, e){
  const ss = sessions.filter(x => x.date >= s && x.date <= e);
  const climb = ss.filter(x => x.type === 'klettern' && x.completed).length, cross = ss.filter(x => x.type === 'ausgleich' && x.completed).length;
  const rest = ss.filter(x => x.type === 'rest').length, skipped = ss.filter(x => x.type !== 'rest' && !x.completed).length;
  const outs = outdoor.filter(r => r.date >= s && r.date <= e);
  if (!ss.length && !outs.length) return '';
  return `<section class="ansec"><h2>Training</h2><div class="antiles four">
    <div class="stat"><div class="n">${climb}</div><div class="l">climbing days</div></div>
    <div class="stat"><div class="n">${cross}</div><div class="l">cross-training</div></div>
    <div class="stat"><div class="n">${rest}</div><div class="l">rest days</div></div>
    <div class="stat"><div class="n">${skipped}</div><div class="l">skipped</div></div></div>
    ${outs.length ? `<div class="hint" style="margin-top:8px">Outdoor log: ${outs.length} route${outs.length === 1 ? '' : 's'} in this period.</div>` : ''}</section>`;
}

/* ============ Update check (GitHub releases) ============ */
const UPDATE_API = 'https://api.github.com/repos/pfreigner-del/climbr/releases/latest';
function verParts(v){ return String(v || '').replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0); }
function newerThan(a, b){ const x = verParts(a), y = verParts(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i]||0) !== (y[i]||0)) return (x[i]||0) > (y[i]||0); } return false; }
async function checkForUpdate(force){
  if (!IS_NATIVE) return;                       // the web version updates itself
  let last = 0; try { last = +localStorage.getItem('climbr.updateChecked') || 0; } catch(e){}
  if (!force && Date.now() - last < 30 * 60 * 1000) return;   // at most every 30 min (GitHub allows 60 checks/h)
  try {
    const mine = await (await fetch('/version.json', {cache:'no-store'})).json();
    const r = await fetch(UPDATE_API, {headers:{Accept:'application/vnd.github+json'}});
    if (!r.ok) return;
    const rel = await r.json();
    try { localStorage.setItem('climbr.updateChecked', String(Date.now())); } catch(e){}
    const apk = (rel.assets || []).find(a => /\.apk$/i.test(a.name));
    if (!apk || !newerThan(rel.tag_name, mine.version)) return;
    let skipped = ''; try { skipped = localStorage.getItem('climbr.updateSkipped') || ''; } catch(e){}
    if (!force && skipped === rel.tag_name) return;
    const pop = document.getElementById('updatePop'), gh = rel.html_url || 'https://github.com/pfreigner-del/climbr/releases/latest';
    pop.innerHTML = `<div class="upbox" role="dialog" aria-modal="true" aria-labelledby="upT">
      <img src="/icons/ui/logo.png" alt="">
      <h2 id="upT">New version available</h2>
      <p class="upv">${esc(mine.version)} → <b>${esc(rel.tag_name.replace(/^v/,''))}</b></p>
      <p class="ups">Tap Update, then confirm “Update” in Android's installer. Your training data stays.</p>
      <button class="btn main" id="updBtn" onclick="installUpdate('${esc(apk.browser_download_url)}')">Update now</button>
      <a class="btn" href="${esc(gh)}" target="_blank" rel="noopener">Open on GitHub</a>
      <button class="btn danger" onclick="skipUpdate('${esc(rel.tag_name)}')">Later</button></div>`;
    pop.hidden = false;
  } catch(e) { /* offline: try again next launch */ }
}
let updating = false;
async function installUpdate(url){
  if (updating) return;
  const btn = document.getElementById('updBtn'), P = window.Capacitor && window.Capacitor.Plugins || {};
  const fallback = () => { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); };
  if (!P.Filesystem || !P.FileOpener) { fallback(); return; }
  updating = true; let h = null;
  try {
    btn.textContent = '0 %'; btn.disabled = true;
    h = await P.Filesystem.addListener('progress', e => { if (e.contentLength) btn.textContent = Math.round(e.bytes / e.contentLength * 100) + ' %'; });
    try { await P.Filesystem.deleteFile({path:'ClimbR-update.apk', directory:'CACHE'}); } catch(e){}
    const res = await P.Filesystem.downloadFile({url, path:'ClimbR-update.apk', directory:'CACHE', progress:true});
    const uri = res.path || (await P.Filesystem.getUri({path:'ClimbR-update.apk', directory:'CACHE'})).uri;
    btn.textContent = 'Install';
    await P.FileOpener.open({filePath: uri, contentType:'application/vnd.android.package-archive'});
  } catch(e) {
    console.warn('in-app update failed', e); btn.textContent = 'Update'; fallback();
  } finally {
    updating = false; btn.disabled = false; if (h) try { h.remove(); } catch(e){}
  }
}
function skipUpdate(tag){ try { localStorage.setItem('climbr.updateSkipped', tag); } catch(e){} document.getElementById('updatePop').hidden = true; }
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });

/* ============ Boot ============ */
sessions = loadSessions(); sortSessions(); customs = loadCustoms();
renderReference(); renderRoutines(); renderTools(); render();
try { const t = localStorage.getItem('climbr.tab'); if (t === 'out' || t === 'stats') showTab(t); } catch(e){}
setTimeout(() => checkForUpdate(), 1500);
fetch('/version.json', {cache:'no-store'}).then(r => r.json()).then(v => { window.APP_VERSION = v.version; render(); }).catch(() => {});
if (!IS_NATIVE && 'serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
